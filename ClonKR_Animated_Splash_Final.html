<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClonKR Splash</title>
<style>
  :root {
    --orange:#ff7a12;
    --deep:#050a25;
    --blue:#111b55;
  }
  * { box-sizing:border-box; }
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#030616;
    font-family:Arial,Helvetica,sans-serif;
  }
  body {
    display:grid; place-items:center;
  }
  .splash {
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 64%, rgba(255,93,35,.26) 0%, rgba(20,25,75,.08) 34%, transparent 58%),
      linear-gradient(180deg,#28144f 0%,#5d214c 38%,#e45736 66%,#101b45 78%,#04081d 100%);
    animation: nightfall 4.1s ease-in forwards;
  }

  /* Sunset / horizon */
  .sun {
    position:absolute; left:50%; bottom:28%;
    width:clamp(64px,10vw,130px); aspect-ratio:1;
    transform:translateX(-50%);
    border-radius:50%;
    background:#ffe89b;
    box-shadow:0 0 45px 18px rgba(255,172,70,.22);
    animation:sunDown 2.65s cubic-bezier(.4,0,.7,1) forwards;
  }
  .horizon {
    position:absolute; left:0; right:0; bottom:24%;
    height:7%;
    background:
      linear-gradient(180deg,transparent,#090f2c 42%),
      linear-gradient(90deg,#070c25,#151936 50%,#070c25);
    clip-path:polygon(0 55%,8% 42%,14% 55%,23% 38%,30% 54%,39% 44%,47% 56%,56% 40%,63% 53%,73% 39%,82% 54%,91% 42%,100% 54%,100% 100%,0 100%);
  }
  .water {
    position:absolute; left:0; right:0; bottom:0; height:31%;
    background:
      repeating-linear-gradient(0deg,rgba(255,139,78,.08) 0 2px,transparent 2px 10px),
      linear-gradient(180deg,#0d1738,#040817);
    opacity:.85;
  }

  /* Logo rises from the horizon */
  .logo-stage {
    position:absolute; left:50%; top:52%;
    width:min(42vw,390px); min-width:250px;
    transform:translate(-50%,130%);
    opacity:0;
    z-index:10;
    animation:logoRise 1.35s 2.65s cubic-bezier(.18,.78,.22,1) forwards;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.42));
  }
  .logo {
    width:100%; display:block;
  }
  .logo.clean {
    position:absolute; inset:0;
    opacity:0;
    object-fit:contain;
    transition:opacity .65s ease;
  }
  .logo.with-figure {
    transition:opacity .65s ease;
  }

  /* The exact orange character is pulled out of the logo. */
  .traveller {
    position:absolute;
    width:min(17vw,170px);
    min-width:105px;
    left:calc(50% + min(12vw,120px));
    top:53%;
    transform:translate(-50%,40px) scale(.78);
    opacity:0;
    z-index:20;
    pointer-events:none;
    filter:drop-shadow(0 13px 14px rgba(0,0,0,.35));
    animation:leaveLogo 1.05s 4.55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .traveller img {
    display:block; width:100%; height:auto;
  }

  /* Dance */
  .dance {
    position:absolute; left:50%; top:53%;
    width:min(18vw,175px); min-width:115px;
    transform:translate(-50%,30px) scale(.7);
    opacity:0;
    z-index:22;
    animation:danceEnter .55s 5.25s ease-out forwards,
              danceMove 1.15s 5.8s ease-in-out 2;
    transform-origin:50% 85%;
  }
  .dance img { width:100%; display:block; }

  .ground-glow {
    position:absolute; left:50%; top:76%;
    width:min(28vw,300px); height:42px;
    transform:translateX(-50%) scale(.2);
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,125,35,.38),rgba(255,125,35,0) 70%);
    opacity:0;
    z-index:18;
    animation:glowIn .5s 5.25s ease-out forwards, glowPulse 1.15s 5.8s ease-in-out 2;
  }

  /* Wise gesture */
  .wise {
    position:absolute; left:50%; top:51%;
    width:min(20vw,190px); min-width:125px;
    transform:translate(-50%,25px) scale(.75);
    opacity:0;
    z-index:23;
    animation:wiseEnter .7s 8.05s cubic-bezier(.2,.8,.2,1) forwards;
    filter:drop-shadow(0 16px 20px rgba(0,0,0,.4));
  }
  .wise img { width:100%; display:block; }

  .caption {
    position:absolute; left:50%; bottom:10%;
    transform:translateX(-50%);
    color:white; text-align:center; white-space:nowrap;
    letter-spacing:.15em; font-size:clamp(10px,1.1vw,15px);
    opacity:0;
    z-index:30;
    animation:captionIn .8s 8.75s ease forwards;
  }
  .caption b { color:#ff7a12; font-weight:800; }

  .fade {
    position:absolute; inset:0; background:#030616;
    opacity:0; z-index:100; pointer-events:none;
    animation:finish 1s 10.1s ease forwards;
  }

  @keyframes nightfall {
    0% { filter:saturate(1.12) brightness(1.08); }
    100% { filter:saturate(.78) brightness(.62); }
  }
  @keyframes sunDown {
    0% { bottom:28%; opacity:1; }
    82% { bottom:19%; opacity:1; }
    100% { bottom:15%; opacity:0; }
  }
  @keyframes logoRise {
    0% { transform:translate(-50%,130%); opacity:0; }
    100% { transform:translate(-50%,-50%); opacity:1; }
  }
  @keyframes leaveLogo {
    0% { opacity:1; transform:translate(-50%,20px) scale(.82); }
    25% { transform:translate(-25%,0) scale(.86) rotate(-4deg); }
    100% { opacity:1; transform:translate(145%,-90px) scale(.72) rotate(5deg); }
  }
  @keyframes danceEnter {
    0% { opacity:0; transform:translate(-50%,50px) scale(.65); }
    100% { opacity:1; transform:translate(-50%,0) scale(1); }
  }
  @keyframes danceMove {
    0% { transform:translate(-50%,0) rotate(-5deg) scale(1); }
    25% { transform:translate(calc(-50% - 24px),-10px) rotate(7deg) scale(1.04,.96); }
    50% { transform:translate(-50%,3px) rotate(-4deg) scale(.98,1.03); }
    75% { transform:translate(calc(-50% + 24px),-12px) rotate(6deg) scale(1.04,.96); }
    100% { transform:translate(-50%,0) rotate(-5deg) scale(1); }
  }
  @keyframes glowIn {
    from { opacity:0; transform:translateX(-50%) scale(.2); }
    to { opacity:1; transform:translateX(-50%) scale(1); }
  }
  @keyframes glowPulse {
    0%,100% { opacity:.75; transform:translateX(-50%) scale(.92); }
    50% { opacity:1; transform:translateX(-50%) scale(1.08); }
  }
  @keyframes wiseEnter {
    0% { opacity:0; transform:translate(-50%,35px) scale(.72); }
    70% { opacity:1; transform:translate(-50%,-6px) scale(1.04); }
    100% { opacity:1; transform:translate(-50%,0) scale(1); }
  }
  @keyframes captionIn {
    from { opacity:0; transform:translate(-50%,10px); }
    to { opacity:1; transform:translate(-50%,0); }
  }
  @keyframes finish {
    to { opacity:1; }
  }

  @media (max-width:700px) {
    .logo-stage { width:min(68vw,330px); }
    .traveller { left:68%; width:26vw; }
    .dance,.wise { width:29vw; }
    .caption { bottom:7%; }
  }
</style>
</head>
