<style>

.dynamic-island-wrap{z-index:20;will-change:min-width}.dynamic-island{height:40px;min-width:124px;padding:0 5px;border-radius:999px;background:rgba(18,22,27,.94);border:1px solid rgba(203,209,214,.38);box-shadow:0 8px 28px rgba(20,24,28,.20),inset 0 1px 0 rgba(255,255,255,.08);display:flex;align-items:center;gap:2px;transition:min-width .32s cubic-bezier(.16,1,.3,1),height .32s cubic-bezier(.16,1,.3,1),padding .32s cubic-bezier(.16,1,.3,1),border-color .32s ease,box-shadow .32s ease,transform .18s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;will-change:min-width,height,transform;transform:translateZ(0)}.dynamic-island.is-expanded{min-width:344px;height:48px;padding:0 7px;border-color:rgba(220,224,228,.65);box-shadow:0 12px 38px rgba(20,24,28,.25),inset 0 1px 0 rgba(255,255,255,.12)}.dynamic-island.is-pressed{transform:translateZ(0) scale(.985)}.island-arrow{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#aeb5bb;cursor:pointer;font-size:21px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease,transform .15s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}.island-arrow:hover{background:#ffffff12;color:#fff;transform:scale(1.1)}.island-arrow:active{transform:scale(.92)}.island-current{position:relative;min-width:104px;height:34px;border:0;border-radius:999px;background:transparent;color:#f5f6f7;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font:600 11px 'Plus Jakarta Sans',system-ui,sans-serif;white-space:nowrap;flex:1;overflow:hidden;transition:background .15s ease}.island-current:hover{background:#ffffff0a}.island-focus{display:inline-flex;align-items:center;gap:7px;color:#fff;transition:transform .22s cubic-bezier(.16,1,.3,1)}.island-dot{width:6px;height:6px;border-radius:50%;background:#d9dde0;box-shadow:0 0 0 3px #ffffff0d,0 0 10px #fff8;transition:box-shadow .3s ease}.island-neighbor{font-size:9px;color:#7f898f;max-width:76px;overflow:hidden;text-overflow:ellipsis;opacity:.85;transition:opacity .22s ease,transform .22s ease}.dynamic-island:not(.is-expanded) .island-neighbor{display:none}.island-chevron{font-size:11px;color:#7f898f;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}.island-chevron.up{transform:rotate(180deg)}.island-dismiss{position:fixed;inset:0;z-index:299}.island-menu{position:absolute;top:calc(100% + 10px);left:50%;width:210px;padding:7px;border-radius:18px;background:rgba(20,24,29,.97);border:1px solid #cfd4d844;box-shadow:0 18px 50px #14181d44;z-index:310;backdrop-filter:blur(18px);opacity:0;animation:islandMenuIn .26s cubic-bezier(.16,1,.3,1) forwards}.island-menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:0;border-radius:11px;background:transparent;color:#aeb5bb;font:600 11px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;text-align:left;transition:background .12s ease,color .12s ease,transform .12s ease}.island-menu-item:hover{background:#ffffff0b;color:#fff;transform:translateX(2px)}.island-menu-item.active{background:#ffffff12;color:#fff}.island-check{color:#dfe3e6}
/* ── Logo hover dropdown (Calendar / Tasks / Meetings / Contacts) ─────── */

.checklist-v1{position:relative}.checklist-v1 .checklist-sidebar{background:linear-gradient(180deg,#fff,#f7f8f9)!important;border:1px solid #d7dce0!important;border-radius:18px!important;box-shadow:0 12px 35px rgba(32,38,44,.08)!important;overflow:hidden}.checklist-v1 .checklist-sidebar .sbHdr{background:linear-gradient(180deg,#f9fafb,#eef0f2)!important;border-bottom:1px solid #dfe3e6!important;padding:15px 16px!important}.checklist-v1 .checklist-sidebar .sbTit{color:#687177!important;letter-spacing:1.4px!important}.checklist-v1 .checklist-sidebar input{background:#fff!important;border:1px solid #d5dade!important;border-radius:12px!important;box-shadow:inset 0 1px 2px #00000008!important}.checklist-v1 .checklist-sidebar button{border-radius:13px!important;margin:3px 8px!important;width:calc(100% - 16px)!important;border:1px solid transparent!important;transition:transform .18s ease,box-shadow .18s ease,background .18s ease!important}.checklist-v1 .checklist-sidebar button:hover{transform:translateX(3px)!important;background:#f0f2f4!important;box-shadow:0 6px 18px #69707812!important}.checklist-v1 .checklist-workspace{min-width:0}.checklist-v1 .checklist-account-panel,.checklist-v1 .checklist-workflow-panel,.checklist-v1 .checklist-empty-panel{background:rgba(255,255,255,.96)!important;border:1px solid #d7dce0!important;border-radius:18px!important;box-shadow:0 12px 35px rgba(32,38,44,.07)!important;overflow:hidden}.checklist-v1 .checklist-account-panel{position:relative}.checklist-v1 .checklist-account-panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#aeb4b9,#eef0f2,#8f969c);opacity:.9}.checklist-v1 .checklist-workflow-panel .pH{background:linear-gradient(180deg,#fafbfc,#f0f2f4)!important;border-bottom:1px solid #dfe3e6!important;padding:14px 16px!important}.checklist-v1 .checklist-workflow-panel .cTitle{letter-spacing:.2px;color:#30383e!important}.checklist-v1 .checklist-workflow-panel input,.checklist-v1 .checklist-workflow-panel textarea,.checklist-v1 .checklist-workflow-panel select{border-color:#d6dadd!important;background:#fbfcfd!important;border-radius:10px!important}.checklist-v1 .checklist-workflow-panel [role="checkbox"]{transition:background .15s ease,transform .15s ease!important}.checklist-v1 .checklist-workflow-panel [role="checkbox"]:hover{background:#f1f3f5!important}.checklist-v1 .checklist-account-panel .ic{background:linear-gradient(145deg,#fbfcfd,#f0f2f4)!important;border:1px solid #d9dde0!important;border-radius:14px!important;box-shadow:inset 0 1px 0 #fff,0 5px 15px #6970780d!important}.checklist-v1 .checklist-account-panel .iL{color:#7a8288!important}.checklist-v1 .checklist-account-panel .iV{color:#30383e!important}.checklist-v1 .checklist-account-panel button{border-radius:10px!important}
